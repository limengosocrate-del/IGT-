<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2E6D" />
  <meta name="description" content="Système de Gestion et de Planification des Missions de l'Inspection Générale du Travail RDC" />
  <title>Système de Gestion et de Planification des Missions de l'Inspection Générale du Travail RDC</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body class="login-body">

  <div class="login-shell">
    <section class="login-right">
      <div class="login-card">
        <!-- Bande drapeau RDC en haut -->
        <div class="lc-flag" aria-hidden="true">
          <span class="lf-b"></span><span class="lf-y"></span><span class="lf-r"></span>
        </div>

        <!-- Logo officiel -->
        <div class="lc-logo">
          <img src="./assets/logo/official.png" alt="IGT RDC — République Démocratique du Congo" />
        </div>

        <h1 class="lc-welcome">Système de Gestion et de Planification des Missions</h1>
        <p class="lc-sub">Inspection Générale du Travail — République Démocratique du Congo</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="login-user">Identifiant</label>
            <div class="input-affix">
              <span class="ai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <input type="text" id="login-user" name="utilisateur" placeholder="Identifiant" autocomplete="username" />
            </div>
            <div class="err" id="err-user"></div>
          </div>
          <div class="field">
            <label for="login-pass">Mot de passe</label>
            <div class="input-affix">
              <span class="ai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input type="password" id="login-pass" name="motdepasse" placeholder="Mot de passe sécurisé" autocomplete="current-password" />
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Afficher / masquer le mot de passe"><svg id="pw-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <div class="err" id="err-pass"></div>
          </div>
          <div class="err" id="err-general" style="margin-bottom:14px;"></div>
          <button type="submit" class="btn blk" id="btn-login">Se connecter</button>
        </form>

        <div class="lc-reserved">Accès réservé au Gestionnaire Administrateur</div>

        <div class="lc-verify">
          <a href="#" id="verify-link">Vérifier un ordre de mission (QR Code)</a>
        </div>
      </div>
      <div class="lc-footer">© Créé par Inspecteur Limengo Daniel (Pmiller) — 2026</div>
    </section>
  </div>

  <!-- Modale vérification QR -->
  <div class="overlay" id="verify-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Vérifier un ordre de mission</h3>
        <button class="xclose" data-close="verify-overlay">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="verify-code">Référence technique de l'ordre (QR Code)</label>
          <input type="text" id="verify-code" placeholder="OM-IGT-2026-000001" />
        </div>
        <div id="verify-result"></div>
      </div>
      <div class="modal-footer">
        <button class="btn sec" data-close="verify-overlay">Fermer</button>
        <button class="btn" id="verify-run">Vérifier</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toasts"></div>

  <script>window.IGT_AUTH_PAGE = true;</script>
  <script src="./js/qrcode-lib.js"></script>
  <script src="./js/qr.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/audit.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    Auth.init();
  </script>
</body>
</html>
